name: Build AirTake
on:
  push:
    branches: [main]
    paths:
      - 'src/AirTake.Core/**'
      - 'src/AirTake.Desktop/**'
      - 'ios/**'
      - 'tests/**'
      - 'scripts/build-ffmpeg.sh'
      - '.github/workflows/build.yml'
      - 'Directory.Build.props'
      - 'global.json'
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: airtake-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ffmpeg:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: .ffmpeg-win
          key: ffmpeg-8.0.3-airtake-minimal-v1
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 make
          bash scripts/build-ffmpeg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win
          path: .ffmpeg-win/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  windows:
    runs-on: windows-latest
    needs: ffmpeg
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-win
          path: package/tools
      - name: Protocol and real mux integration tests
        shell: pwsh
        run: |
          dotnet run --project tests/AirTake.Tests -c Release -- "$PWD/package/tools/ffmpeg.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Publish self-contained Windows EXE
        run: dotnet publish src/AirTake.Desktop -c Release -r win-x64 -o package -p:DebugType=None -p:DebugSymbols=false
      - name: Launch EXE and render the actual desktop UI
        shell: pwsh
        run: |
          New-Item qa -ItemType Directory -Force | Out-Null
          $p = Start-Process -FilePath "$PWD/package/AirTake.exe" -ArgumentList @('--smoke-test', "$PWD/qa/desktop.png") -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'EXE smoke test timed out' }
          if ($p.ExitCode -ne 0) { if (Test-Path smoke-error.txt) { Get-Content smoke-error.txt }; throw 'EXE smoke test failed' }
      - name: Package portable application
        shell: pwsh
        run: |
          Copy-Item README.md package/README.md
          Copy-Item LICENSE package/LICENSE
          Copy-Item docs package/docs -Recurse
          $root = (Resolve-Path package).Path
          $files = @(Get-ChildItem package -Recurse -File | Where-Object Name -ne 'SHA256SUMS.txt')
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $relative = [IO.Path]::GetRelativePath($root, $file.FullName).Replace('\','/')
            "$hash  $relative"
          }
          $lines | Set-Content -LiteralPath package/SHA256SUMS.txt -Encoding utf8
          Compress-Archive -Path package/* -DestinationPath AirTake-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AirTake-Windows-x64
          path: AirTake-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AirTake-QA
          path: qa/
          retention-days: 30
  ios:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test the native persistent upload queue
        run: |
          swiftc -swift-version 5 ios/AirTakeCamera/Models.swift ios/AirTakeCamera/DiskSpool.swift tests/ios/main.swift -o /tmp/airtake-spool-tests
          /tmp/airtake-spool-tests
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate and compile native iPhone application
        run: |
          set -o pipefail
          cd ios
          xcodegen generate
          xcodebuild -project AirTakeCamera.xcodeproj -scheme AirTakeCamera -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tee xcodebuild.log
      - name: Package unsigned iPhone application
        run: |
          mkdir -p ios/package/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/AirTakeCamera.app ios/package/Payload/
          cd ios/package
          zip -qry ../../AirTake-iPhone-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AirTake-iPhone-unsigned
          path: AirTake-iPhone-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AirTake-iOS-build-log
          path: |
            ios/xcodebuild.log
            qa/ios-spool-tests.json
          retention-days: 30
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AirTake-Windows-x64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: AirTake-iPhone-unsigned
          path: release
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = `v0.1.0-rc.${context.runNumber}`;
            let release;
            try { release = (await github.rest.repos.getReleaseByTag({...context.repo, tag})).data; }
            catch(e) {
              if (e.status !== 404) throw e;
              release = (await github.rest.repos.createRelease({...context.repo, tag_name: tag, target_commitish: context.sha, name: `AirTake ${tag}`, prerelease: true, body: 'Windows: extract the entire ZIP and run AirTake.exe. Runtime and FFmpeg are included. iPhone: the IPA is UNSIGNED and requires your own Apple signing identity before installation. Native device build, persistent phone-queue tests and Windows protocol/mux tests passed; sustained iPhone 16 Pro 4K/120 recording over your Wi-Fi still needs physical-device validation. See README and docs/START-RU.md.'})).data;
            }
            for (const name of ['AirTake-Windows-x64.zip', 'AirTake-iPhone-unsigned.ipa']) {
              const old = release.assets.find(a => a.name === name);
              if (old) await github.rest.repos.deleteReleaseAsset({...context.repo, asset_id: old.id});
              await github.rest.repos.uploadReleaseAsset({...context.repo, release_id: release.id, name, data: fs.readFileSync(`release/${name}`)});
            }
