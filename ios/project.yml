name: AirTakeCamera
options:
  bundleIdPrefix: io.teamon.airtake
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  AirTakeCamera:
    type: application
    platform: iOS
    sources:
      - AirTakeCamera
    info:
      path: GeneratedInfo.plist
      properties:
        CFBundleDisplayName: AirTake Camera
        NSCameraUsageDescription: Основная камера для беспроводной записи на ваш компьютер.
        NSLocalNetworkUsageDescription: Передача видео и управление записью в вашей локальной сети.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.teamon.airtake.camera
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  AirTakeCamera:
    build:
      targets:
        AirTakeCamera: all
    run:
      config: Debug
